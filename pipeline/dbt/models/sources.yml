version: 2

sources:
  - name: raw
    database: real-zaragoza-500608
    schema: raw
    tables:
      - name: sofascore_matches
        description: "Raw SofaScore match data (all pipeline leagues). One row per match per scrape run — not deduplicated."
      - name: sofascore_player_match_stats
        description: "Raw SofaScore per-player per-match stats (~40 stats). One row per (player, match) per scrape run."
      - name: sofascore_shots
        description: "Raw SofaScore shot events with xG and pitch coordinates. One row per shot per scrape run."
      - name: sofascore_team_match_stats
        description: "Raw SofaScore per-team per-match aggregated stats. One row per (team, match) per scrape run."
      - name: transfermarkt_players
        description: "Multi-league Transfermarkt player data (25 active leagues, 1RFEF excluded). Written by scraper_transfermarkt_leagues.py quarterly. Includes all clubs in each league, e.g. Zaragoza via LaLiga2."
      - name: capology_wages
        description: "Gross wages for ~2500 players across top 5 EU leagues. Written by scraper_capology.py quarterly."
      - name: bqml_wage_predictions
        description: "Append-only BQML wage predictions for all TM players. One row per player per quarterly run. Written by rz-wage-predictor Cloud Run Job."

  - name: wc_2026
    database: real-zaragoza-500608
    schema: wc_2026
    tables:
      - name: sofascore_matches
        description: "FIFA World Cup 2026 match data (tournament_id=16, season_id=58210)."
      - name: sofascore_player_match_stats
        description: "FIFA World Cup 2026 player match stats."
      - name: sofascore_shots
        description: "FIFA World Cup 2026 shot events."
      - name: sofascore_team_match_stats
        description: "FIFA World Cup 2026 team match stats."
