version: 2

seeds:
  - name: club_name_aliases
    description: "SofaScore team_name -> Transfermarkt club_name lookup, scoped by league_name. Built by fuzzy-matching (rapidfuzz) + manual review to bridge naming differences between SofaScore and TM's Spanish-language site (translated names, prefix/suffix drift, e.g. 'FC Bayern München' -> 'Bayern Múnich'). Only confident matches (exact, accent-normalized, fuzzy score >=90, or manually confirmed) are included — ambiguous/rejected candidates are omitted rather than risking a false join. Rebuild by rerunning the alias script when new leagues or seasons are added."
    columns:
      - name: sofascore_team_name
        description: "Team name as it appears in gold.fct_player_season_stats."
        tests:
          - not_null
      - name: league_name
        description: "League scope for the match (matching is restricted within a league to avoid cross-league false positives)."
        tests:
          - not_null
      - name: tm_club_name
        description: "Corresponding club_name in gold.agg_player_market_values."
        tests:
          - not_null
      - name: match_score
        description: "rapidfuzz WRatio score (0-100), or 100 for exact/manual matches."
      - name: match_method
        description: "How the match was derived: exact, normalized, fuzzy_auto (score>=90), or manual_confirm (hand-reviewed)."
      - name: sofascore_team_id
        description: "SofaScore team_id for this row's club, resolved by pipeline/scripts/build_team_id_map.py from silver.matches. Empty if not yet observed in silver.matches (e.g. league not backfilled)."
      - name: tm_club_id
        description: "Transfermarkt club_id for this row's club, resolved by pipeline/scripts/build_team_id_map.py from silver.tm_players. Empty if TM has no current snapshot for this club (e.g. club since relegated out of the tracked division)."

  - name: player_id_map
    description: "sofascore_player_id <-> tm_player_id identity crosswalk. TM's player_id is a permanent per-person ID (from the /profil/spieler/{id} URL), stable across clubs/seasons, so this is a single static map, not a per-season one — a transferred player keeps the same pair. Built by pipeline/scripts/build_player_id_map.py: club-bridge matching (fuzzy name match restricted to TM players who were ever listed at a club this SofaScore player also played for, via club_name_aliases' ID columns) where possible, global name-only fuzzy search as a fallback. Only match_method='club_bridge_auto' should be treated as trusted for automated joins — all other methods are flagged for manual review and may contain wrong matches (shared-surname or shared-first-name collisions); rebuild periodically as new TM/SofaScore players appear."
    columns:
      - name: sofascore_player_id
        description: "SofaScore player identifier. One row per distinct SofaScore player that has any candidate TM match."
        tests:
          - not_null
          - unique
      - name: sofascore_player_name
        description: "Player name as most recently seen on SofaScore."
      - name: tm_player_id
        description: "Transfermarkt player identifier for the matched person."
        tests:
          - not_null
      - name: tm_player_name
        description: "Player name as listed on Transfermarkt."
      - name: match_score
        description: "rapidfuzz WRatio score (0-100) between the two names."
      - name: match_method
        description: "club_bridge_auto (trusted: high score + clear margin over 2nd-best candidate at a club this player is confirmed to have played for), club_bridge_manual_confirm (club-corroborated but below the auto-accept bar — needs a human glance), name_only_fallback_manual_confirm (no club corroboration available at all — needs a human glance), or absent entirely if no plausible candidate was found (~34% of SofaScore players, mostly ones with no TM snapshot for any club they've played at)."
      - name: matched_at
        description: "Date this row was generated by the build script."
