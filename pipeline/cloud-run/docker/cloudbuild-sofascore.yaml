# Run from pipeline/cloud-run/docker/:
#   gcloud builds submit . --config cloudbuild-sofascore.yaml
# NOTE: rz-scraper-sofascore Cloud Run job is currently unused (GCP IPs blocked by SofaScore).
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.sofascore
      - -t
      - europe-west1-docker.pkg.dev/real-zaragoza-500608/rz-images/rz-scraper-sofascore:latest
      - .
images:
  - europe-west1-docker.pkg.dev/real-zaragoza-500608/rz-images/rz-scraper-sofascore:latest
