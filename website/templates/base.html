<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Real Zaragoza Analytics{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav>
    <a href="/" class="brand">RZ Analytics</a>
    <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Home</a>
    <a href="/squad" {% if request.path == '/squad' %}class="active"{% endif %}>Squad</a>
    <a href="/calculator" {% if request.path == '/calculator' %}class="active"{% endif %}>Match Calculator</a>
    <a href="/scouting" {% if request.path == '/scouting' %}class="active"{% endif %}>Scouting</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
